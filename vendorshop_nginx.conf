set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.252.0/22;
real_ip_header CF-Connecting-IP;

server {
    root /var/www/html;
    server_name  vendorshop.radiowavehub.com;

    if ($host != "vendorshop.radiowavehub.com") {
        return 444;
    }

    location / {
                proxy_pass         http://localhost:7855;
                proxy_http_version 1.1;
                proxy_set_header   Upgrade $http_upgrade;
                proxy_set_header   Connection keep-alive;
                proxy_set_header   Host $host;
                proxy_cache_bypass $http_upgrade;
                proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header   X-Forwarded-Proto $scheme;
                proxy_set_header   X-Real-IP $remote_addr;
                client_max_body_size 100M;
    }

    location ~ /.git {
        deny all;
        return 404;
    }

    location ~ \.log$ {
        deny all;
        return 404;
    }

    location ~ \.yml$ {
        deny all;
        return 404;
    }

    location ~ ^/wp-json {
        deny all;
        return 404;
    }

    location ~ ^/wp-content/server-info {
        deny all;
        return 404;
    }

    location ~* \.php$ {
        return 404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vendorshop.radiowavehub.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vendorshop.radiowavehub.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = vendorshop.radiowavehub.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name  vendorshop.radiowavehub.com;
    return 404; # managed by Certbot
}